    <!-- Apply saved theme before first paint (prevents a flash) -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            d.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
